name: linux CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
      matrix:
        object: [small, large]
    name: linux - ${{ matrix.object }}-object
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt-get -qq update
        sudo apt install build-essential libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev meson ninja-build
    - name: meson
      run: meson setup -Dlarge-object=${{ matrix.object == 'large' }} builddir
    - name: ninja
      run: ninja -C builddir
    - name: meson test
      run: meson test -C builddir --print-errorlogs
    - name: meson dist
      run: meson dist -C builddir
