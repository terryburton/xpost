name: analysers

# The compiler's own diagnostics are errors in every build (meson.build).
# These are the checks that cost too much to run on every compile: two
# static analysers that walk paths rather than statements, and two
# dynamic ones that run the suite and watch what it touches.
#
# A job blocks on what the tree already answers and counts the rest: a
# job that fails from the first run is a job that gets disabled, so a
# class earns its place among the blocking ones by reaching zero first.
# The counts are the ratchet. Where a finding cannot happen, the reason
# belongs at the site the checker points at, so that the next reader
# meets it there; a class kept out of the blocking set says here why the
# checker cannot be held to zero on it.
#
# Blocking today: the leak count under the address sanitizer, every
# class the gcc analyser reports, all of cppcheck's but memleak and the
# style severities, unreachable code outside the sites that declare
# themselves parked, and the compile of the tree with the optimiser on --
# which is here rather than in meson.build because two of the promotions
# meson.build makes are answered with silence until something optimises.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]

jobs:

  sanitizers:
    name: address, leak and undefined behaviour
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev fontconfig fonts-urw-base35 \
          meson ninja-build llvm
    # These lanes run the same suite, so they need the same faces: a
    # standard name reaches findfont through fontconfig, which answers a
    # machine carrying no fonts with nothing at all, and the name then
    # raises invalidfont.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    # The suite is the workload: it already drives every device, every
    # filter and the collector. A sanitizer over it is the cheapest
    # coverage available, and it is how a heap overflow in the fax
    # encoder and two undefined shifts would have been found by the
    # build rather than by hand.
    - name: setup
      run: |
        meson setup builddir \
          -Db_sanitize=address,undefined \
          -Db_lundef=false
    - name: build
      run: ninja -C builddir
    - name: test
      env:
        # Leak detection is off here and checked by the job below: what
        # blocks is a memory-safety error or undefined behaviour, which
        # the tree is clean of, so this job is green from its first run
        # and a regression is what turns it red.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
      # memacct weighs the process, which a sanitizer's shadow maps and
      # quarantine necessarily perturb, and one of its tests runs a leak
      # checker of its own.
      run: |
        meson test -C builddir --print-errorlogs \
          --no-suite memacct --timeout-multiplier 5

  leaks:
    name: leak check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev fontconfig fonts-urw-base35 \
          meson ninja-build llvm
    # These lanes run the same suite, so they need the same faces: a
    # standard name reaches findfont through fontconfig, which answers a
    # machine carrying no fonts with nothing at all, and the name then
    # raises invalidfont.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    - name: setup and build
      run: |
        meson setup builddir -Db_sanitize=address -Db_lundef=false
        ninja -C builddir
    # Each process that leaks writes its report to a file of its own,
    # and the count is the number of those files. It is not read out of
    # the run's log, because most of the suite's wrappers run the
    # interpreter with its output captured -- out=$(... 2>&1) -- and a
    # report written to stderr is consumed by the wrapper that captured
    # it, leaving meson only the wrapper's verdict. A count taken from
    # the log therefore counts the tests that print straight through and
    # no others; a count of files counts every process that ran.
    #
    # The sanitizer's exit status is turned off for the same reason from
    # the other side. A report otherwise ends the process through the
    # sanitizer's own exit, which returns a failing status and skips the
    # flush of whatever the interpreter had buffered -- so a wrapper
    # reading back what it printed fails for want of its own output, and
    # reports a broken interpreter where what happened was a leak. With
    # it off, the suite's result says whether the tree works and the
    # count says what leaked, and neither stands in for the other. A
    # memory-safety error keeps the sanitizer's status in the job above,
    # which is where that class blocks.
    #
    # The suppressions name what the tree links but does not own, so
    # what is counted is the tree's own, and the count required is zero.
    # The suite's own result is required too: a run that ends the job
    # early leaves the count reading zero for want of processes to
    # report, which is the shape a leak gate fails silently in.
    #
    # The count and the allocation sites are both printed, so a red run
    # says how much leaked and where without opening the log.
    - name: test and check
      env:
        # log_path names a directory that must already exist; the run
        # step below makes it. meson runs each test from the build tree,
        # so both paths are named from the checkout rather than relative
        # to it.
        ASAN_OPTIONS: >-
          detect_leaks=1:abort_on_error=0:exitcode=0:log_path=${{ github.workspace }}/leak-logs/asan
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
      run: |
        mkdir -p leak-logs
        meson test -C builddir --print-errorlogs --no-suite memacct \
          --timeout-multiplier 5
        echo '--- processes reporting a leak ---'
        leaks=$(grep -l 'LeakSanitizer: detected' leak-logs/* 2>/dev/null \
          | wc -l)
        echo "$leaks"
        echo '--- allocation sites ---'
        cat leak-logs/* 2>/dev/null | grep -A4 'Direct leak' \
          | grep -oE 'src/lib/[a-z_0-9]+\.c:[0-9]+' \
          | sort | uniq -c | sort -rn || true
        [ "$leaks" -eq 0 ]
    - uses: actions/upload-artifact@v4
      with:
        name: leak-log
        path: |
          builddir/meson-logs/testlog.txt
          leak-logs
        retention-days: 30
      if: always()

  valgrind:
    name: valgrind memcheck
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev fontconfig fonts-urw-base35 \
          meson ninja-build valgrind
    # These lanes run the same suite, so they need the same faces: a
    # standard name reaches findfont through fontconfig, which answers a
    # machine carrying no fonts with nothing at all, and the name then
    # raises invalidfont.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    - name: setup and build
      run: |
        meson setup builddir
        ninja -C builddir
    # meson's own wrapper, so every test runs under it rather than a
    # hand-picked few.
    - name: test under memcheck
      run: |
        meson test -C builddir --print-errorlogs \
          --wrapper='valgrind --error-exitcode=9 --leak-check=full \
                     --errors-for-leak-kinds=definite --track-origins=yes' \
          --timeout-multiplier 20

  gcc-analyzer:
    name: gcc -fanalyzer
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev meson ninja-build
    - name: setup
      run: meson setup builddir -Dc_args=-fanalyzer
    # Every class this analyser reports is at zero on the tree, so a
    # finding of any class is a regression and this job blocks. Where a
    # path it walks cannot happen, the reason it cannot is written at the
    # site rather than being carried here as an exception.
    - name: build and summarise
      run: |
        ninja -C builddir 2>&1 | tee analyzer.log || true
        echo '--- findings by class ---'
        grep -oE '\[-Wanalyzer-[a-z-]+\]' analyzer.log \
          | sort | uniq -c | sort -rn | tee analyzer.counts
        echo '--- total ---'
        grep -c 'warning:' analyzer.log || true
        ! grep -q '\[-Wanalyzer-' analyzer.log
    - uses: actions/upload-artifact@v4
      with:
        name: gcc-analyzer
        path: |
          analyzer.log
          analyzer.counts
        retention-days: 30
      if: always()

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cppcheck
    # --check-level=exhaustive costs time and finds the paths a normal
    # run gives up on. missingInclude is suppressed because the system
    # headers are not what is being checked.
    - name: run
      run: |
        cppcheck --enable=all --force --inline-suppr \
          --check-level=exhaustive \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --template='{file}:{line}: {severity}: {id}: {message}' \
          -I src/lib src/lib src/bin 2>cppcheck.log || true
        echo '--- findings by severity and id ---'
        sed -E 's/^[^ ]+ //; s/:.*$//' cppcheck.log | sort | uniq -c | sort -rn | head -30
        echo '--- errors only ---'
        grep -E ': error: ' cppcheck.log || echo 'none'
        # The classes below are at zero on the tree and block. The rest
        # are counted above. What is not here and why:
        #
        # memleak reads a filter constructor handing its struct to the
        # object layer as the base the struct begins with, sees a pointer
        # into the allocation rather than the allocation, and calls the
        # transfer a leak. It says so at four of the nineteen
        # constructors that do exactly the same thing, and which four
        # moves with the version, so the class cannot be held to zero
        # without marking sites at random. The leak class the gcc
        # analyser reports covers the same ground and does block, having
        # been shown the transfer.
        #
        # The style severities -- variableScope, constVariablePointer,
        # constParameterPointer -- are a separate argument about how the
        # tree declares things, not about what it does.
        echo '--- classes held to zero ---'
        blocking='uninitvar|uninitdata|va_list_usedBeforeStarted'
        blocking="$blocking|shiftTooManyBits|nullPointerRedundantCheck"
        blocking="$blocking|unreachableCode|unsignedLessThanZero"
        blocking="$blocking|invalidPrintfArgType_[a-z]+"
        grep -E ": ($blocking):" cppcheck.log || echo 'none'
        ! grep -qE ": ($blocking):" cppcheck.log
    - uses: actions/upload-artifact@v4
      with:
        name: cppcheck
        path: cppcheck.log
        retention-days: 30
      if: always()

  scan-build:
    name: clang static analyser
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev meson ninja-build \
          clang clang-tools
    - name: run
      run: |
        scan-build -o plist --status-bugs \
          sh -c 'meson setup builddir && ninja -C builddir' || true
        echo '--- reports ---'
        find plist -name '*.html' | wc -l
    - uses: actions/upload-artifact@v4
      with:
        name: scan-build
        path: plist/**/*.html
        retention-days: 30
      if: always()

  optimised-warnings:
    strategy:
      matrix:
        object: [small, large]
    name: diagnostics that need the optimiser - ${{ matrix.object }}-object
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev meson ninja-build
    # Two of the diagnostics meson.build promotes to errors say nothing
    # at all to a compiler that has not optimised: gcc reaches a null
    # dereference, and a condition whose two branches are the same,
    # through passes -O turns on. meson's default buildtype is debug, so
    # every other lane in every workflow compiles at -O0 -- the flags are
    # accepted there, the promotion is on the command line, and neither
    # class is being looked for anywhere. Reading the build says they are
    # covered.
    #
    # This lane compiles the tree once with the optimiser on and does
    # nothing else: no suite, no sanitizer, no analyser. The build's own
    # status is the whole of the check, because what is being asked is
    # already an error. It is a lane of its own rather than a buildtype
    # given to one of the lanes above, because each of those reads
    # something off a run -- what the sanitizers saw, what memcheck saw,
    # what -fanalyzer walked -- and the optimiser changes all three; the
    # analyser in particular reports fifteen paths at -O2 that it does
    # not report at -O0, and that lane blocks at zero.
    #
    # -Winline is turned off for the compile rather than answered.
    # It reports where the optimiser declined an inline, which is a
    # decision and not a defect, and at -O it has some dozens to report;
    # the promoted classes are what this lane is reading and they should
    # not arrive in a page of them.
    #
    # Both object widths, like the linux workflow: the width is a type's
    # width and the optimiser reasons about types, so a comparison or a
    # shift the promotions catch in one of them is not necessarily
    # reachable in the other.
    - name: build with the optimiser on
      run: |
        meson setup -Dlarge-object=${{ matrix.object == 'large' }} \
          --buildtype=debugoptimized -Dc_args=-Wno-inline builddir
        ninja -C builddir

  unreachable-code:
    name: unreachable code
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev meson ninja-build clang
    # -Wunreachable-code is asked for here rather than in meson.build,
    # and the reason is that meson would take it and it would do
    # nothing. cc.get_supported_arguments tests whether a compiler
    # accepts a flag, not whether the flag says anything: gcc accepts
    # this one -- it is a recognised option name, and misspelling it is
    # an error that suggests the right spelling -- and reports nothing
    # for it, on this tree or on a function written to be unreachable.
    # A flag in the default build that the primary compiler ignores is
    # worse than no flag, because reading the build says the class is
    # covered. clang implements it, so it is asked of clang, in the job
    # where clang is what compiles.
    - name: setup and build
      run: |
        # The build's own status is read through the tee, so a build that
        # broke is a red job here rather than a log with no findings in
        # it -- which the check below would otherwise read as three
        # parked sites having gone quiet.
        set -o pipefail
        CC=clang meson setup builddir -Dc_args=-Wunreachable-code
        ninja -C builddir 2>&1 | tee unreachable.log
    # Three sites are unreachable on purpose: each is an implementation
    # kept beside the decision that would enable it, behind a return
    # that says it is not enabled, and each says so where the checker
    # points. They are named by file, because a line number moves and a
    # register that has to be renumbered to stay true is a register that
    # stops being true.
    #
    # Held from both ends. A finding in any other file fails: that is
    # code nobody meant to be unreachable, which is the class this job
    # exists for. A file named here that no longer produces one fails
    # too -- the parked implementation was enabled or removed, and an
    # entry describing neither would go on excusing whatever appeared in
    # that file next.
    - name: check
      run: |
        cat > parked <<'REGISTER'
        src/lib/xpost_garbage.c
        src/lib/xpost_interpreter.c
        src/lib/xpost_memory.c
        REGISTER
        grep -F '[-Wunreachable-code]' unreachable.log \
          | sed -E 's@^.*(src/(lib|bin)/[A-Za-z_0-9]+\.[ch]).*@\1@' \
          | sort > found.all
        sort -u found.all > found
        echo '--- findings by file ---'
        uniq -c found.all
        echo '--- unparked ---'
        comm -23 found parked | tee unparked
        echo '--- parked and silent ---'
        comm -13 found parked | tee stale
        [ ! -s unparked ] || {
          echo 'code is unreachable in a file that does not say it is parked'
          exit 1
        }
        [ ! -s stale ] || {
          echo 'a file is registered as holding parked code and holds none'
          exit 1
        }
    - uses: actions/upload-artifact@v4
      with:
        name: unreachable-code
        path: unreachable.log
        retention-days: 30
      if: always()
