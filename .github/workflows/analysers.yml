name: analysers

# The compiler's own diagnostics are errors in every build (meson.build).
# These are the checks that cost too much to run on every compile: two
# static analysers that walk paths rather than statements, and two
# dynamic ones that run the suite and watch what it touches.
#
# A job blocks on what the tree already answers and counts the rest: a
# job that fails from the first run is a job that gets disabled, so a
# class earns its place among the blocking ones by reaching zero first.
# The counts are the ratchet. Where a finding cannot happen, the reason
# belongs at the site the checker points at, so that the next reader
# meets it there; a class kept out of the blocking set says here why the
# checker cannot be held to zero on it.
#
# Blocking today: the leak count under the address sanitizer, every
# class the gcc analyser reports, all of cppcheck's but memleak and the
# style severities, unreachable code outside the sites that declare
# themselves parked, and the compile of the tree with the optimiser on --
# which is here rather than in meson.build because two of the promotions
# meson.build makes are answered with silence until something optimises.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]

jobs:

  sanitizers:
    strategy:
      # one run reports every lane: a red lane hides the others otherwise,
      # and a backlog is then found one failure per run
      fail-fast: false
      matrix:
        object: [small, large]
    # Both object widths, because the width is a type's width. A shift is
    # the clearest case: what counts as shifting the whole field, and
    # what a right shift brings down into it, are answers about how wide
    # the integer is, so one width can execute a shift the other cannot
    # reach and each has undefined counts the other has not.
    name: address and undefined behaviour - ${{ matrix.object }}-object
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev fontconfig fonts-urw-base35 \
          meson ninja-build llvm
    # These lanes run the same suite, so they need the same faces: a
    # standard name reaches findfont through fontconfig, which answers a
    # machine carrying no fonts with nothing at all, and the name then
    # raises invalidfont.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    # The suite is the workload: it already drives every device, every
    # filter and the collector. A sanitizer over it is the cheapest
    # coverage available, and it is how a heap overflow in the fax
    # encoder and two undefined shifts would have been found by the
    # build rather than by hand.
    - name: setup
      run: |
        meson setup builddir \
          -Dlarge-object=${{ matrix.object == 'large' }} \
          -Db_sanitize=address,undefined \
          -Db_lundef=false
    - name: build
      run: ninja -C builddir
    # What this lane rests on is that the build carries the runtimes it
    # asked for, and nothing in the run says whether it does. A suite
    # that passes says the tree works; it says that just as loudly on a
    # build with no sanitizer in it, and the count of leak reports below
    # is zero on a clean run and zero on a run that could not have
    # reported one. So the binary is asked, before the suite is.
    - name: the sanitizer is in the build
      run: |
        for rt in asan ubsan; do
          ldd builddir/src/bin/xpost 2>/dev/null | grep -q "$rt" ||
          nm builddir/src/bin/xpost 2>/dev/null | grep -q "__${rt}_" || {
            echo "builddir/src/bin/xpost carries no $rt runtime;"
            echo "this lane would run the suite with nothing watching it"
            exit 1
          }
          echo "$rt: present"
        done
    - name: test
      env:
        # Leak detection is off here and checked by the job below: what
        # blocks is a memory-safety error or undefined behaviour, which
        # the tree is clean of, so this job is green from its first run
        # and a regression is what turns it red.
        #
        # halt_on_error is what makes the second half of that true. The
        # undefined behaviour sanitizer recovers by default: it prints
        # the diagnostic and lets the program carry on, so the process
        # exits zero, the test that ran passes, and the finding reaches
        # nobody but a reader of the log beside a green tick. Meson's own
        # default for a test is halt_on_error=1, and an env block here
        # replaces that default wholesale rather than adding to it, so
        # the setting holds only by being stated.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Through the profile wrapper, which reads off the build which
      # tests this build can answer for: memacct weighs the process,
      # which a sanitizer's shadow maps and quarantine necessarily
      # perturb, and vmlimit runs under an address-space limit the same
      # runtime reserves past. Naming either here would be a second copy
      # of that knowledge, and a copy that stops agreeing with the tree
      # is how a suite quietly runs less than it says.
      #
      # No --timeout-multiplier: meson.build scales the limits itself
      # where the build is sanitized, so they arrive scaled and a
      # multiplier here would multiply what was multiplied.
      run: |
        MESON_BUILD_ROOT="$PWD/builddir" sh tests/run-profile.sh full \
          --print-errorlogs

  leaks:
    name: leak check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev fontconfig fonts-urw-base35 \
          meson ninja-build llvm
    # These lanes run the same suite, so they need the same faces: a
    # standard name reaches findfont through fontconfig, which answers a
    # machine carrying no fonts with nothing at all, and the name then
    # raises invalidfont.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    - name: setup and build
      run: |
        meson setup builddir -Db_sanitize=address -Db_lundef=false
        ninja -C builddir
    # What this lane rests on is that the build carries the runtimes it
    # asked for, and nothing in the run says whether it does. A suite
    # that passes says the tree works; it says that just as loudly on a
    # build with no sanitizer in it, and the count of leak reports below
    # is zero on a clean run and zero on a run that could not have
    # reported one. So the binary is asked, before the suite is.
    - name: the sanitizer is in the build
      run: |
        for rt in asan; do
          ldd builddir/src/bin/xpost 2>/dev/null | grep -q "$rt" ||
          nm builddir/src/bin/xpost 2>/dev/null | grep -q "__${rt}_" || {
            echo "builddir/src/bin/xpost carries no $rt runtime;"
            echo "this lane would run the suite with nothing watching it"
            exit 1
          }
          echo "$rt: present"
        done
    # Each process that leaks writes its report to a file of its own,
    # and the count is the number of those files. It is not read out of
    # the run's log, because most of the suite's wrappers run the
    # interpreter with its output captured -- out=$(... 2>&1) -- and a
    # report written to stderr is consumed by the wrapper that captured
    # it, leaving meson only the wrapper's verdict. A count taken from
    # the log therefore counts the tests that print straight through and
    # no others; a count of files counts every process that ran.
    #
    # The sanitizer's exit status is turned off for the same reason from
    # the other side. A report otherwise ends the process through the
    # sanitizer's own exit, which returns a failing status and skips the
    # flush of whatever the interpreter had buffered -- so a wrapper
    # reading back what it printed fails for want of its own output, and
    # reports a broken interpreter where what happened was a leak. With
    # it off, the suite's result says whether the tree works and the
    # count says what leaked, and neither stands in for the other. A
    # memory-safety error keeps the sanitizer's status in the job above,
    # which is where that class blocks.
    #
    # The suppressions name what the tree links but does not own, so
    # what is counted is the tree's own, and the count required is zero.
    # The suite's own result is required too: a run that ends the job
    # early leaves the count reading zero for want of processes to
    # report, which is the shape a leak gate fails silently in.
    #
    # The count and the allocation sites are both printed, so a red run
    # says how much leaked and where without opening the log.
    - name: test and check
      env:
        # log_path names a directory that must already exist; the run
        # step below makes it. meson runs each test from the build tree,
        # so both paths are named from the checkout rather than relative
        # to it.
        ASAN_OPTIONS: >-
          detect_leaks=1:abort_on_error=0:exitcode=0:log_path=${{ github.workspace }}/leak-logs/asan
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
      run: |
        mkdir -p leak-logs
        MESON_BUILD_ROOT="$PWD/builddir" sh tests/run-profile.sh full \
          --print-errorlogs
        echo '--- processes reporting a leak ---'
        leaks=$(grep -l 'LeakSanitizer: detected' leak-logs/* 2>/dev/null \
          | wc -l)
        echo "$leaks"
        echo '--- allocation sites ---'
        cat leak-logs/* 2>/dev/null | grep -A4 'Direct leak' \
          | grep -oE 'src/lib/[a-z_0-9]+\.c:[0-9]+' \
          | sort | uniq -c | sort -rn || true
        [ "$leaks" -eq 0 ]
    - uses: actions/upload-artifact@v4
      with:
        name: leak-log
        path: |
          builddir/meson-logs/testlog.txt
          leak-logs
        retention-days: 30
      if: always()

  valgrind:
    name: valgrind memcheck
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev fontconfig fonts-urw-base35 \
          meson ninja-build valgrind
    # These lanes run the same suite, so they need the same faces: a
    # standard name reaches findfont through fontconfig, which answers a
    # machine carrying no fonts with nothing at all, and the name then
    # raises invalidfont.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    # Virtual memory is one allocation from the host that the interpreter
    # suballocates, so a checker sees the whole of it as memory the process
    # owns and says nothing about what is done inside it: reading an entity
    # the collector has reclaimed is an ordinary read of an ordinary byte.
    # That is the one place a collector's mistakes appear, and it is the
    # place this lane would otherwise be blind in. Described, the arena
    # reports such a read against whoever made it.
    #
    # It costs about a sixteenth of the lane's time, measured, and answers
    # nothing on a tree that is sound: the whole of this profile ran under
    # it over ten thousand times with no report.
    - name: setup and build
      run: |
        meson setup builddir -Dvalgrind-arena=true
        ninja -C builddir
    # meson's own wrapper, so every test runs under it rather than a
    # hand-picked few.
    #
    # Through the profile wrapper, as the sanitizer lanes are, and for
    # the same reason: it reads which tests a run can answer for rather
    # than being told. A memory checker displaces the memacct weighings
    # and the vmlimit limit exactly as a sanitizer runtime does, and
    # naming those suites here would be a second copy of knowledge the
    # wrapper already holds.
    # The checker follows the interpreter. meson's wrapper is applied to
    # the whole test command, and most of this suite's tests are a shell
    # script that starts the interpreter as a child, so without this the
    # process being watched is the shell and the interpreter runs
    # unwatched. The utilities those scripts also start are skipped by
    # path: each has allocations of its own, and none of them is the
    # tree's. The interpreter is not skipped -- it lives in the build
    # directory, which no pattern here names.
    #
    # The checker writes to files of its own rather than to the process
    # it watches. Some tests read back what the interpreter printed, and
    # one of them requires a quiet run to write nothing at all, so a
    # checker that announced itself on their stderr would be failing
    # them for its own output. The reports are printed below when the
    # run does not pass, and kept as an artifact either way.
    - name: test under memcheck
      #
      # The fast tests, not every test. Two kinds of test cannot be run
      # this way, and both carry the slow tag. One draws a path of
      # fifteen thousand segments to reach an implementation limit: it
      # costs five minutes on its own and tens of times that under a
      # checker, which is a job that does not finish rather than a job
      # that is slow. The other three run a checker themselves -- that is
      # what they are for -- and a checker cannot run under a checker.
      # What is left is the interpreter watched across the whole of the
      # fast suite, which is what this lane never had before.
      run: |
        mkdir -p vglogs
        MESON_BUILD_ROOT="$PWD/builddir" sh tests/run-profile.sh quick \
          --print-errorlogs \
          --wrapper="valgrind --error-exitcode=9 --trace-children=yes --trace-children-skip=/usr/bin/*,/bin/*,/usr/lib/*,/sbin/*,/usr/sbin/* --leak-check=full --errors-for-leak-kinds=definite --track-origins=yes --log-file=$PWD/vglogs/vg.%p.log --suppressions=$PWD/tests/valgrind.supp" \
          --timeout-multiplier 60 || {
            # Selected on the count, not on the words: every report ends
            # with a summary naming each kind, so a search for the words
            # matches the reports that found nothing just as well as the
            # ones that found something.
            echo '--- what the checker reported ---'
            grep -l 'ERROR SUMMARY: [1-9]' vglogs/*.log 2>/dev/null |
              while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          }
    - uses: actions/upload-artifact@v4
      with:
        name: memcheck-reports
        path: vglogs
        retention-days: 30
      if: always()

  gcc-analyzer:
    strategy:
      # one run reports every lane: a red lane hides the others otherwise,
      # and a backlog is then found one failure per run
      fail-fast: false
      matrix:
        object: [small, large]
        buildtype: [debug, debugoptimized]
    name: gcc -fanalyzer - ${{ matrix.object }}-object, ${{ matrix.buildtype }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev meson ninja-build
    # Both optimisation levels, because -fanalyzer walks what the
    # optimiser left it: with -O on, a callee is inlined into its caller
    # and the analyser reasons over the merged body rather than over a
    # summary of the call, so each level reaches paths the other does
    # not. The two are held to zero separately.
    #
    # The optimised legs also carry the diagnostics meson.build promotes
    # to errors that say nothing to a compiler which has not optimised:
    # gcc reaches a null dereference, and a condition whose two branches
    # are the same, through passes -O turns on, and meson's default
    # buildtype is debug, so every other lane in every workflow compiles
    # at -O0 and neither class is being looked for. -Winline is turned
    # off rather than answered: it reports where the optimiser declined
    # an inline, which is a decision and not a defect, and at -O it has
    # some dozens to report.
    #
    # Both object widths, because the width is a type's width: a
    # comparison or a shift is not necessarily reachable in both.
    #
    # The node budget is raised from its default of eight. At that
    # default the analyser exhausts its per-program-point budget inside
    # this tree's largest functions, merges the states it has, and then
    # reports paths the merged state permits and the code does not --
    # a loop it has been told nothing about looks like a loop that runs
    # no times. Raising it buys precision, not blindness.
    - name: setup
      run: |
        meson setup builddir \
          -Dlarge-object=${{ matrix.object == 'large' }} \
          --buildtype=${{ matrix.buildtype }} \
          "-Dc_args=-fanalyzer -Wno-inline \
                    --param analyzer-max-enodes-per-program-point=64"
    # Every class this analyser reports is at zero on the tree, so a
    # finding of any class is a regression and this job blocks. Where a
    # path it walks cannot happen, the reason it cannot is written at the
    # site rather than being carried here as an exception. The build's
    # own status blocks too: the promoted classes above are errors, and a
    # job that read only the analyser's findings would pass a tree that
    # did not compile.
    - name: build and summarise
      run: |
        ninja -C builddir 2>&1 | tee analyzer.log
        status=${PIPESTATUS[0]}
        echo '--- findings by class ---'
        grep -oE '\[-Wanalyzer-[a-z-]+\]' analyzer.log \
          | sort | uniq -c | sort -rn | tee analyzer.counts
        echo '--- total ---'
        grep -c 'warning:' analyzer.log || true
        test "$status" -eq 0
        ! grep -q '\[-Wanalyzer-' analyzer.log
    - uses: actions/upload-artifact@v4
      with:
        name: gcc-analyzer-${{ matrix.object }}-${{ matrix.buildtype }}
        path: |
          analyzer.log
          analyzer.counts
        retention-days: 30
      if: always()

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cppcheck
    # --check-level=exhaustive costs time and finds the paths a normal
    # run gives up on. missingInclude is suppressed because the system
    # headers are not what is being checked.
    #
    # Every verdict below is the absence of a pattern in the log, so the
    # run that wrote the log has to be held to having happened. Given a
    # path it cannot open, cppcheck writes an empty log and exits 1 --
    # the complaint goes to its standard output, not into the log -- and
    # a job reading only the log then finds no findings and passes over
    # nothing checked. So its status is read, and so is the number of
    # files it opened: a run that reached a fraction of the tree leaves
    # a log as clean as one that reached all of it. The floor is well
    # under the fifty-seven sources there are, because what it is for is
    # the difference between most of them and none.
    - name: run
      run: |
        set -o pipefail
        cppcheck --enable=all --force --inline-suppr \
          --check-level=exhaustive \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --template='{file}:{line}: {severity}: {id}: {message}' \
          -I src/lib src/lib src/bin 2>cppcheck.log | tee cppcheck.progress
        echo '--- sources checked ---'
        checked=$(grep -c '^Checking .* \.\.\.$' cppcheck.progress)
        echo "$checked"
        [ "$checked" -ge 40 ] || {
          echo "cppcheck opened $checked sources; the tree has far more"
          exit 1
        }
        echo '--- findings by severity and id ---'
        sed -E 's/^[^ ]+ //; s/:.*$//' cppcheck.log | sort | uniq -c | sort -rn | head -30
        echo '--- errors only ---'
        grep -E ': error: ' cppcheck.log || echo 'none'
        # The classes below are at zero on the tree and block. The rest
        # are counted above. What is not here and why:
        #
        # memleak reads a filter constructor handing its struct to the
        # object layer as the base the struct begins with, sees a pointer
        # into the allocation rather than the allocation, and calls the
        # transfer a leak. It says so at four of the nineteen
        # constructors that do exactly the same thing, and which four
        # moves with the version, so the class cannot be held to zero
        # without marking sites at random. The leak class the gcc
        # analyser reports covers the same ground and does block, having
        # been shown the transfer.
        #
        # The style severities -- variableScope, constVariablePointer,
        # constParameterPointer -- are a separate argument about how the
        # tree declares things, not about what it does.
        echo '--- classes held to zero ---'
        blocking='uninitvar|uninitdata|va_list_usedBeforeStarted'
        blocking="$blocking|shiftTooManyBits|nullPointerRedundantCheck"
        blocking="$blocking|unreachableCode|unsignedLessThanZero"
        blocking="$blocking|invalidPrintfArgType_[a-z]+"
        grep -E ": ($blocking):" cppcheck.log || echo 'none'
        ! grep -qE ": ($blocking):" cppcheck.log
    - uses: actions/upload-artifact@v4
      with:
        name: cppcheck
        path: cppcheck.log
        retention-days: 30
      if: always()

  scan-build:
    name: clang static analyser
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev meson ninja-build \
          clang clang-tools
    # This one counts rather than blocks, so --status-bugs is what is
    # swallowed. It reports a bug and a build that fell over through the
    # same status, though, and the count below reads the same either way:
    # no reports is what a clean tree and an empty one both look like. So
    # the build is read from what it produced instead.
    - name: run
      run: |
        scan-build -o plist --status-bugs \
          sh -c 'meson setup builddir && ninja -C builddir' || true
        test -x builddir/src/bin/xpost || {
          echo 'the analysed build produced no interpreter, so the count'
          echo 'below is a count over a build that did not happen'
          exit 1
        }
        echo '--- reports ---'
        find plist -name '*.html' 2>/dev/null | wc -l
    - uses: actions/upload-artifact@v4
      with:
        name: scan-build
        path: plist/**/*.html
        retention-days: 30
      if: always()

  unreachable-code:
    name: unreachable code
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libpng-dev libjpeg-dev \
          libfreetype6-dev libfontconfig1-dev meson ninja-build clang
    # -Wunreachable-code is asked for here rather than in meson.build,
    # and the reason is that meson would take it and it would do
    # nothing. cc.get_supported_arguments tests whether a compiler
    # accepts a flag, not whether the flag says anything: gcc accepts
    # this one -- it is a recognised option name, and misspelling it is
    # an error that suggests the right spelling -- and reports nothing
    # for it, on this tree or on a function written to be unreachable.
    # A flag in the default build that the primary compiler ignores is
    # worse than no flag, because reading the build says the class is
    # covered. clang implements it, so it is asked of clang, in the job
    # where clang is what compiles.
    - name: setup and build
      run: |
        # The build's own status is read through the tee, so a build that
        # broke is a red job here rather than a log with no findings in
        # it -- which the check below would otherwise read as three
        # parked sites having gone quiet.
        set -o pipefail
        CC=clang meson setup builddir -Dc_args=-Wunreachable-code
        ninja -C builddir 2>&1 | tee unreachable.log
    # Three sites are unreachable on purpose: each is an implementation
    # kept beside the decision that would enable it, behind a return
    # that says it is not enabled, and each says so where the checker
    # points. They are named by file, because a line number moves and a
    # register that has to be renumbered to stay true is a register that
    # stops being true.
    #
    # Held from both ends. A finding in any other file fails: that is
    # code nobody meant to be unreachable, which is the class this job
    # exists for. A file named here that no longer produces one fails
    # too -- the parked implementation was enabled or removed, and an
    # entry describing neither would go on excusing whatever appeared in
    # that file next.
    - name: check
      run: |
        cat > parked <<'REGISTER'
        src/lib/xpost_garbage.c
        src/lib/xpost_interpreter.c
        src/lib/xpost_memory.c
        REGISTER
        grep -F '[-Wunreachable-code]' unreachable.log \
          | sed -E 's@^.*(src/(lib|bin)/[A-Za-z_0-9]+\.[ch]).*@\1@' \
          | sort > found.all
        sort -u found.all > found
        echo '--- findings by file ---'
        uniq -c found.all
        echo '--- unparked ---'
        comm -23 found parked | tee unparked
        echo '--- parked and silent ---'
        comm -13 found parked | tee stale
        [ ! -s unparked ] || {
          echo 'code is unreachable in a file that does not say it is parked'
          exit 1
        }
        [ ! -s stale ] || {
          echo 'a file is registered as holding parked code and holds none'
          exit 1
        }
    - uses: actions/upload-artifact@v4
      with:
        name: unreachable-code
        path: unreachable.log
        retention-days: 30
      if: always()

  # Thirty-two-bit pointers, which no other lane builds. mingw64 gives a
  # 32-bit long beside 64-bit pointers, and that is what caught the last
  # two width defects; what is missing everywhere else is a pointer and a
  # size_t of four bytes, which is a different set of casts.
  #
  # A 32-bit userland rather than a multilib compiler, so the libraries
  # the interpreter is built against are the same width as the
  # interpreter, and every optional feature is available rather than
  # configured off.
  #
  # The build only, for now. The suite does not pass here: four of its
  # unit tests end in the C library's heap checks, which is a defect in
  # the tree and not in this lane, and a lane that arrived red would be a
  # lane nobody reads. The build is what catches a truncation or a format
  # that only a narrow pointer reaches, and it is clean today; the suite
  # belongs here as soon as the heap corruption is fixed.
  ilp32:
    name: 32-bit pointers
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: build in a 32-bit userland
      run: |
        docker run --rm --platform linux/386 \
          -v "$PWD":/src:ro -v "$PWD/out32":/work \
          i386/debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq build-essential meson ninja-build pkg-config \
              libpng-dev libjpeg-dev libfreetype-dev libfontconfig-dev
            gcc -dumpmachine
            meson setup /work/build /src
            ninja -C /work/build'
